<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meadow Siege</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1a2317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meadow Siege">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: one column. HUD strip, then the field, then the armoury bar and a context panel. Start and end screens swap in for the field. */
:root{
  --bg:#1a2317; --panel:#243020; --panel-2:#2e3b28; --line:#43553a;
  --fg:#f0ead2; --muted:#a8b092; --accent:#e9b23c; --danger:#e2643f; --good:#94d160;
  --display:"Saira Stencil One","Arial Black",Impact,sans-serif;
  --ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);font-size:15px;line-height:1.4}
.app{max-width:980px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.04em;color:var(--accent);line-height:1}
.brand small{display:block;font-family:var(--ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.hud{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;min-width:64px}
.chip b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.chip span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip.lives b{color:var(--danger)} .chip.cash b{color:var(--accent)}
.stage{position:relative}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.progTrack{flex:1;min-width:0;height:10px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line) calc(10% - 1px) 10%),var(--panel)}
.progTrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c98f22,var(--accent));transition:width .4s}
#progTxt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
canvas#cv{display:block;width:100%;height:auto;border-radius:12px;border:3px solid #2e4a1c;touch-action:manipulation;cursor:crosshair;background:#86b944;-webkit-user-select:none;user-select:none}
canvas#cv.building{touch-action:none}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,26,16,.88);color:var(--fg);padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;flex:1 1 100%;min-width:0}
.tbtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--fg);font:inherit;cursor:pointer;text-align:left;min-width:0}
.tbtn canvas{width:34px;height:34px;flex:none}
.tbtn .t{display:flex;flex-direction:column;min-width:0}
.tbtn .t b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn .t span{font-size:13px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.tbtn .key{display:none}
.tbtn.on{border-color:var(--accent);background:var(--panel-2)}
.tbtn.poor .t span{color:var(--danger)}
.controls{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 300px}
.btn.off{opacity:.6;text-decoration:line-through}
.diffs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:15px;padding:6px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--accent);color:#1d1a0e}
.seg button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
#diffNote{color:var(--muted);font-size:14px}
button{font-family:var(--ui)}
.btn{background:var(--panel);border:2px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1a0e;flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tbtn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.info{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;min-height:52px}
.info h3{margin:0;font-size:17px}
.info .stats{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.info .stats b{color:var(--fg)}
.info .grow{flex:1 1 220px;min-width:0}
.info .next{color:var(--muted);font-size:14px}
.info .next b{color:var(--fg)}
.info .acts{display:flex;gap:6px}
.screen{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding-block:26px;padding-inline:clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:18px}
.screen h1{font-family:var(--display);font-size:clamp(38px,8vw,72px);line-height:.95;margin:0;color:var(--accent);letter-spacing:.02em;text-wrap:balance}
.screen .lede{font-size:18px;max-width:58ch;margin:0;color:var(--fg)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mode h2{margin:0;font-size:22px}
.mode p{margin:0;color:var(--muted)}
.mode .best{font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums}
.how{margin:0;padding-left:20px;color:var(--muted);max-width:65ch;display:grid;gap:4px}
.how b{color:var(--fg)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.results div{background:var(--panel-2);border-radius:8px;padding:10px 12px}
.results b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.results span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.share{width:100%;min-height:54px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;font:inherit;padding:8px;resize:none}
@media (max-width:560px){.brand{font-size:20px}.chip{min-width:50px;padding:3px 8px}.chip b{font-size:16px}
  .palette{grid-template-columns:repeat(6,minmax(0,1fr));flex-basis:100%;gap:4px}.tbtn{flex-direction:column;gap:0;padding:4px 2px}.tbtn .t{align-items:center}.tbtn .t b,.tbtn .key{display:none}
  .controls .btn{padding:8px 10px;font-size:14px}#prog{display:none!important}.app{padding-block:10px 20px;gap:8px}}
@media (max-width:759px) and (orientation:portrait){canvas#cv{width:auto;max-width:100%;max-height:calc(100svh - 196px);margin:0 auto}}

/* start screen: riveted command board */
.board{position:relative;background:linear-gradient(180deg,#3b4034,#272b22);border:3px solid #12150d;border-radius:16px;box-shadow:inset 0 0 0 2px #596050,inset 0 3px 0 3px rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.45);padding-block:26px 26px;padding-inline:clamp(16px,3.4vw,30px);gap:16px}
.board::before{content:"";position:absolute;inset:7px;border-radius:11px;pointer-events:none;
  background:radial-gradient(circle,#dfe3cc 0 1.6px,#50564a 2.2px 3px,transparent 3.5px) top left/32px 10px repeat-x,
             radial-gradient(circle,#dfe3cc 0 1.6px,#50564a 2.2px 3px,transparent 3.5px) bottom left/32px 10px repeat-x,
             radial-gradient(circle,#dfe3cc 0 1.6px,#50564a 2.2px 3px,transparent 3.5px) top left/10px 32px repeat-y,
             radial-gradient(circle,#dfe3cc 0 1.6px,#50564a 2.2px 3px,transparent 3.5px) top right/10px 32px repeat-y}
.boardTitle{font-family:var(--display);font-size:clamp(36px,7.5vw,66px);line-height:1;margin:0;text-align:center;letter-spacing:.04em;text-wrap:balance;
  background:linear-gradient(180deg,#fff4b0,#ffc63c 48%,#e06a1c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#ffc63c;
  filter:drop-shadow(0 3px 0 #3b1906) drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.boardSub{margin:-6px 0 0;text-align:center;color:var(--muted);font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.boardGrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:720px){.boardGrid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.plate{background:linear-gradient(180deg,#181b13,#22261b);border:1px solid #0c0e09;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);border-radius:7px;padding:7px 12px;font-family:var(--display);color:var(--accent);font-size:20px;letter-spacing:.06em;text-align:center}
.plate.small{font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:4px 10px}
.preview{border:3px solid #12150d;border-radius:12px;box-shadow:0 0 0 3px #687060,0 6px 16px rgba(0,0,0,.4);overflow:hidden;background:#86b944}
.preview canvas{display:block;width:100%;height:auto}
#briefing{margin:0;background:#15180f;border:1px solid #0c0e09;border-radius:8px;padding:10px 12px;color:#f3e7b8;font-size:16px;line-height:1.45}
.modeList{display:flex;flex-direction:column;gap:6px}
.modeList button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:#15180f;border:2px solid #0c0e09;border-radius:9px;padding:8px 12px;color:var(--muted);font:inherit;cursor:pointer}
.modeList button b{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:#c9c3a4;font-weight:400}
.modeList button span{font-size:13px}
.modeList button[aria-checked="true"]{border-color:var(--accent);background:linear-gradient(180deg,#2c2a14,#1c1b0e);box-shadow:0 0 0 1px #12150d,0 0 14px rgba(233,178,60,.35)}
.modeList button[aria-checked="true"] b{color:var(--accent)}
.modeList button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.board .seg{width:100%;justify-content:space-between}.board .seg button{flex:1}
.board .seg button[data-d="easy"][aria-checked="true"]{background:#7cc23a}.board .seg button[data-d="hard"][aria-checked="true"]{background:#ef5a3a;color:#fff}
#modeBest{font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums;text-align:center}
.startBtn{font-family:var(--display);font-size:30px;letter-spacing:.1em;padding:12px;background:linear-gradient(180deg,#ffdc66,#e99d1e);color:#2a1a04;border:3px solid #12150d;border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.2),0 4px 0 #12150d;cursor:pointer}
.startBtn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.2),0 2px 0 #12150d}
.startBtn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.ghostBtn{background:transparent;border:2px solid #596050;color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}

.mapPick{display:flex;gap:8px;align-items:stretch}.mapPick .plate{flex:1}
.arrowBtn{width:46px;flex:none;background:linear-gradient(180deg,#ffdc66,#e99d1e);border:2px solid #12150d;border-radius:8px;font-size:28px;font-weight:700;color:#2a1a04;cursor:pointer;line-height:1;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.arrowBtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mapStars{display:flex;justify-content:center;align-items:baseline;gap:10px}.mapStars span{font-size:24px;letter-spacing:3px;color:#ffd24a;text-shadow:0 2px 0 #3b1906}.mapStars small{color:var(--muted);font-size:13px}
.modeList{display:grid;grid-template-columns:1fr 1fr}.modeList button b{font-size:17px}.modeList button span{font-size:12px;line-height:1.25}
.row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.row2 .ghostBtn{padding:8px 4px;font-size:14px}
.contBtn{display:flex;flex-direction:column;align-items:center;gap:1px;background:linear-gradient(180deg,#8fd85a,#4f9a2a);border:3px solid #12150d;border-radius:12px;color:#102006;padding:8px;cursor:pointer;font:inherit;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #12150d}
.contBtn b{font-family:var(--display);font-size:22px;letter-spacing:.06em;font-weight:400}.contBtn span{font-size:13px;font-weight:700}
.tbtn.locked{opacity:.3;filter:grayscale(1)}
.tmRow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px;font-weight:700}
.tmBtn{background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tmBtn[aria-pressed="true"]{background:var(--accent);color:#1d1a0e;border-color:var(--accent)}
.btn.spec{display:flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:240px;gap:2px}.btn.spec small{font-weight:600;font-size:12px;opacity:.8;line-height:1.25}
.info .acts{flex-wrap:wrap}
.bigStars{text-align:center;font-size:46px;letter-spacing:6px;color:#ffd24a;text-shadow:0 3px 0 #3b1906;line-height:1}
.bigStars:empty{display:none}
.statsGrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}@media (max-width:720px){.statsGrid{grid-template-columns:minmax(0,1fr)}}
.chartBox{background:#15180f;border:1px solid #0c0e09;border-radius:8px;padding:8px}.chartBox canvas{width:100%;height:auto;display:block}
.tblWrap{overflow-x:auto;background:#15180f;border:1px solid #0c0e09;border-radius:8px;padding:4px 6px}
.tt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}.tt th{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:right;padding:5px 6px;font-weight:700}
.tt th:first-child,.tt td:first-child{text-align:left}.tt td{padding:6px;text-align:right;border-top:1px solid #2e3328}
.tt .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}.tt .bar{display:block;height:4px;border-radius:2px;margin-top:4px;min-width:2px}
.mvp{margin:4px 0 0;color:#f3e7b8;font-size:14px}
.achNew{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.achNew:empty{display:none}
.achChip{background:#2c2a14;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
#overScreen .results b{color:var(--fg)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,6,.74);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modalCard{width:min(560px,100%);max-height:100%;overflow:auto}
.mHead{display:flex;align-items:center;gap:10px}.mHead h2{flex:1;margin:0;font-family:var(--display);color:var(--accent);font-size:28px;font-weight:400;letter-spacing:.03em;text-wrap:balance}
.achList{display:grid;gap:6px}.ach{display:flex;gap:10px;align-items:center;background:#15180f;border:1px solid #0c0e09;border-radius:8px;padding:8px 10px}
.ach .ic{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#2e3328;color:var(--muted)}.ach.on .ic{background:var(--accent);color:#1d1a0e}
.ach b{display:block}.ach span{color:var(--muted);font-size:13px}.ach:not(.on){opacity:.65}
.setRow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #3a4034}.setRow:first-child{border-top:0}
.setRow label{flex:1;font-weight:700;min-width:0}.setRow label small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.setRow input[type=range]{width:min(170px,40vw);accent-color:var(--accent)}.setRow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.choiceTxt{margin:8px 0 0;font-size:16px;text-align:center;color:var(--fg)}.choiceTxt b{color:#ffd76a}
.winBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.winBtns .btn{padding:12px;font-size:18px}
.qb{position:absolute;inset:0;pointer-events:none;z-index:5}
.qBtn{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border:2px solid #12150d;cursor:pointer;font:inherit;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #12150d,0 4px 10px rgba(0,0,0,.35);line-height:1}
.qUp,.qSell{width:40px;height:40px;border-radius:50%;color:#fff}.qBtn span{font-size:22px;margin-top:-2px}.qBtn small{position:absolute;top:100%;margin-top:4px;background:rgba(14,19,10,.85);color:#f0ead2;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap}
.qUp{background:radial-gradient(circle at 35% 30%,#8fd0ff,#2a7fe0 60%,#1a4e9a)}.qSell{background:radial-gradient(circle at 35% 30%,#ff9a86,#e0402a 60%,#8a1a0e)}
.qUp.poor{filter:grayscale(.7) brightness(.8)}.qSpec{border-radius:999px;padding:6px 10px;font-size:12px;white-space:nowrap;color:#fff;background:linear-gradient(180deg,#5aa8ff,#2a62c0)}
.qSpec.b{background:linear-gradient(180deg,#43d6f0,#1b8aa8)}.qSpec.a{background:linear-gradient(180deg,#c88cff,#7a3ac8)}.qSpec.poor{filter:grayscale(.7) brightness(.8)}
.qBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}

.row2{grid-template-columns:repeat(4,minmax(0,1fr))}
.campBtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:linear-gradient(180deg,#6a46a0,#3e2468);border:3px solid #12150d;border-radius:12px;color:#fff;padding:9px 14px;cursor:pointer;font:inherit;text-align:left;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #12150d}
.campBtn b{font-family:var(--display);font-size:24px;font-weight:400;letter-spacing:.05em;color:#ffd76a}.campBtn span{font-size:13px;font-weight:700;opacity:.92}
.campList{display:grid;gap:6px;margin-top:8px}.campLvl{display:flex;align-items:center;gap:12px;background:#15180f;border:2px solid #0c0e09;border-radius:10px;padding:8px 12px;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.campLvl .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#1d1a0e;font-weight:800;flex:none}.campLvl .t{flex:1;display:flex;flex-direction:column;min-width:0}.campLvl small{color:var(--muted)}
.campLvl .s{color:#ffd24a;letter-spacing:2px;font-weight:700;white-space:nowrap}.campLvl.lock{opacity:.45;cursor:default}.campLvl.lock .n{background:#3a4034;color:var(--muted)}.campLvl:not(.lock):hover{border-color:var(--accent)}
.cbRow{margin-top:6px;font-size:13px;color:#8fd8ff}.cbRow b{color:#bfe8ff}
.abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:1 1 100%}
.abBtn{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--fg);font:inherit;cursor:pointer;text-align:left;min-width:0}
.abBtn svg{width:24px;height:24px;flex:none;color:#8fd0ff;position:relative;z-index:1}.abBtn .abT{display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}.abBtn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function showOver(won){G.over=true;store.set('meadowsiege:save',null);const best=store.get(bestKey(G.mode==='campaign'?'camp'+G.level:G.mode,G.dateStr,G.diff,G.map))||{score:G.score};

function drawChart(){const c=$('statChart'),g=c.getContext('2d'),w=c.width,h=c.height,d=G.st.lives,mx=G.startLives,pl=40,pr=12,pt=14,pb=30;g.clearRect(0,0,w,h);
  const n=Math.max(2,d.length),X=i=>pl+(w-pl-pr)*i/(n-1),Y=v=>pt+(h-pt-pb)*(1-v/mx);
  g.strokeStyle='rgba(240,234,210,.12)';g.fillStyle='#a8b092';g.font='600 13px "Barlow Semi Condensed",sans-serif';g.lineWidth=1;g.textAlign='right';g.textBaseline='middle';
  for(const v of[0,mx/2,mx]){const y=Y(v);g.beginPath();g.moveTo(pl,y);g.lineTo(w-pr,y);g.stroke();g.fillText(String(Math.round(v)),pl-6,y)}
  g.textAlign='center';g.textBaseline='top';const step=n>60?25:n>25?10:5;for(let i=0;i<n;i+=step)g.fillText('W'+(i+1),X(i),h-pb+8);
  if(d.length<2){g.fillText('Not enough waves to chart',w/2,h/2);return}
  g.beginPath();d.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.lineTo(X(d.length-1),Y(0));g.lineTo(X(0),Y(0));g.closePath();
  const gr=g.createLinearGradient(0,pt,0,h-pb);gr.addColorStop(0,'rgba(233,178,60,.45)');gr.addColorStop(1,'rgba(233,178,60,.03)');g.fillStyle=gr;g.fill();
  g.beginPath();d.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.strokeStyle='#e9b23c';g.lineWidth=2.5;g.stroke();
  const li=d.length-1;g.fillStyle='#ffd24a';g.beginPath();g.arc(X(li),Y(d[li]),4,0,7);g.fill()}
